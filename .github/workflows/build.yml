name: Build prisma-generic
run-name: ${{ github.actor }} Running prisma-generic build.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-prisma-generic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.22.2', '22.23.4']
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}

    - name: Install current npm and locked dependencies
      run: |
        npm install --global npm@12.2.1
        npm ci --include=dev --no-audit --no-fund
        npm test

    - name: Read the locked Prisma version
      id: prisma
      run: echo "version=$(node -p 'require("./package-lock.json").packages["node_modules/prisma"].version')" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image for verification
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        push: false
        tags: prisma-generic:test
        build-args: NODE_VERSION=${{ matrix.node }}
        cache-from: type=gha,scope=node-${{ matrix.node }}
        cache-to: type=gha,mode=max,scope=node-${{ matrix.node }}

    - name: Verify packaged Prisma and migrations offline
      run: PRISMA_TEST_IMAGE=prisma-generic:test npm test

    # PR branches, forks, Dependabot and manual runs build without registry access.
    - name: Login to Amazon ECR Public
      id: ecr
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node == '24.22.2' && github.actor != 'dependabot[bot]'
      uses: aws-actions/amazon-ecr-login@v2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ECR_SECRET_ACCESS_KEY }}
        AWS_REGION: us-east-1
      with:
        registry-type: public

    - name: Publish the verified Node 24 image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node == '24.22.2' && github.actor != 'dependabot[bot]'
      env:
        REGISTRY: ${{ steps.ecr.outputs.registry }}
        PRISMA_VERSION: ${{ steps.prisma.outputs.version }}
      run: |
        image="$REGISTRY/tjsrowe/prisma-generic"
        docker tag prisma-generic:test "$image:$GITHUB_SHA"
        docker tag prisma-generic:test "$image:$PRISMA_VERSION"
        docker push "$image:$GITHUB_SHA"
        docker push "$image:$PRISMA_VERSION"
